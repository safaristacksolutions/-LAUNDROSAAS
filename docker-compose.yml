version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: laundrosaas
      POSTGRES_USER: laundrosaas
      POSTGRES_PASSWORD: ${DB_PASSWORD:-laundrosaas_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  django:
    build:
      context: backend
      dockerfile: Dockerfile
    command: gunicorn config.wsgi:application -b 0.0.0.0:8000 -w 4
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    depends_on:
      - db
      - redis
    env_file:
      - backend/.env

  celery:
    build:
      context: backend
      dockerfile: Dockerfile
    command: celery -A config worker -l info -c 4
    volumes:
      - backend_media:/app/media
    depends_on:
      - db
      - redis
    env_file:
      - backend/.env

  celery-beat:
    build:
      context: backend
      dockerfile: Dockerfile
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      - db
      - redis
    env_file:
      - backend/.env

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/conf:/etc/letsencrypt
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    depends_on:
      - django

volumes:
  postgres_data:
  backend_media:
  backend_static:
